<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d" />
      <stop offset="100%" stop-color="#0a1830" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153054" />
      <stop offset="50%" stop-color="#2E9EF7" />
      <stop offset="100%" stop-color="#153054" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect width="800" height="120" fill="url(#bgGrad)" />

  <text x="400" y="42" text-anchor="middle" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-style="italic" font-size="18" fill="#eaf4ff">
    Build things. Break things. Learn from both.
  </text>

  <path d="M0,85 C150,45 300,110 450,75 C600,40 700,95 800,60 L800,120 L0,120 Z" fill="url(#waveGrad)" opacity="0.85">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0,85 C150,45 300,110 450,75 C600,40 700,95 800,60 L800,120 L0,120 Z; M0,65 C150,100 300,45 450,85 C600,110 700,55 800,80 L800,120 L0,120 Z; M0,85 C150,45 300,110 450,75 C600,40 700,95 800,60 L800,120 L0,120 Z" />
  </path>
</svg>