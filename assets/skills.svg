<svg width="350" height="145" viewBox="0 0 350 145" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .glow-box {
        stroke: #2E9EF7;
        stroke-width: 2;
        stroke-opacity: 0.15;
        animation: borderPulse 3.5s ease-in-out infinite;
      }
      .p1 { animation-delay: 0.0s; }
      .p2 { animation-delay: 0.25s; }
      .p3 { animation-delay: 0.5s; }
      .p4 { animation-delay: 0.75s; }
      .p5 { animation-delay: 1.0s; }
      .p6 { animation-delay: 1.25s; }
      .p7 { animation-delay: 1.5s; }

      .spin-atom {
        transform-origin: 26px 26px;
        animation: spin 10s linear infinite;
      }
      .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }

      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.15; stroke: #2E9EF7; }
        50% { stroke-opacity: 1; stroke: #60baff; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Scaled Group (0.76x) to fit cleanly within 145px height -->
  <g transform="translate(2, 2) scale(0.76)">
    <!-- ROW 1: js, ts, cs, dart, py -->
    <g transform="translate(4, 4)">
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#F0DB4F" class="glow-box p1" />
        <text x="23" y="43" font-size="22" fill="#323330" class="txt">JS</text>
      </g>
      <g transform="translate(64, 0)">
        <rect width="52" height="52" rx="12" fill="#007ACC" class="glow-box p2" />
        <text x="21" y="43" font-size="22" fill="#ffffff" class="txt">TS</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="52" height="52" rx="12" fill="#9B4F96" class="glow-box p3" />
        <path d="M30,17 A11,11 0 1,0 30,35" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
        <text x="33" y="31" font-size="14" fill="#ffffff" class="txt">#</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p4" />
        <polygon points="15,27 26,12 40,26 32,39 18,39" fill="#0081C6" />
        <polygon points="18,39 32,39 40,26 26,26" fill="#00D2B8" />
        <polygon points="26,12 37,16 40,26 26,26" fill="#2E9EF7" />
      </g>
      <g transform="translate(256, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p5" />
        <path d="M26,11 C19,11 18,14 18,17 L18,22 L27,22 L27,24 L15,24 C12,24 11,27 11,32 C11,37 13,39 16,39 L19,39 L19,34 C19,31 22,29 25,29 L33,29 C35,29 37,27 37,24 L37,17 C37,13 34,11 26,11 Z" fill="#387EB8" />
        <path d="M26,41 C33,41 34,38 34,35 L34,30 L25,30 L25,28 L37,28 C40,28 41,25 41,20 C41,15 39,13 36,13 L33,13 L33,18 C33,21 30,23 27,23 L19,23 C17,23 15,25 15,28 L15,35 C15,39 18,41 26,41 Z" fill="#FFE052" />
      </g>
    </g>

    <!-- ROW 2: flutter, dotnet, nodejs, react, express, mongodb, mysql -->
    <g transform="translate(4, 66)">
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p1" />
        <polygon points="29,11 13,27 18,32 39,11" fill="#47C5FB" />
        <polygon points="29,25 20,34 29,43 39,43 29,33 39,25" fill="#00569E" />
      </g>
      <g transform="translate(64, 0)">
        <rect width="52" height="52" rx="12" fill="#512BD4" class="glow-box p2" />
        <text x="26" y="33" font-size="16" text-anchor="middle" fill="#ffffff" class="txt">.NET</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p3" />
        <polygon points="26,11 40,19 40,34 26,42 12,34 12,19" fill="none" stroke="#83CD29" stroke-width="2.5" />
        <text x="26" y="31" font-size="13" text-anchor="middle" fill="#83CD29" class="txt">JS</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p4" />
        <circle cx="26" cy="26" r="3" fill="#00D8FF" />
        <g class="spin-atom">
          <ellipse cx="26" cy="26" rx="15" ry="5.5" fill="none" stroke="#00D8FF" stroke-width="1.5" />
          <ellipse cx="26" cy="26" rx="15" ry="5.5" fill="none" stroke="#00D8FF" stroke-width="1.5" transform="rotate(60 26 26)" />
          <ellipse cx="26" cy="26" rx="15" ry="5.5" fill="none" stroke="#00D8FF" stroke-width="1.5" transform="rotate(120 26 26)" />
        </g>
      </g>
      <g transform="translate(256, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p5" />
        <text x="26" y="33" font-size="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="300">ex</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="52" height="52" rx="12" fill="#11352B" class="glow-box p6" />
        <path d="M26,10 C26,10 35,18 34,29 C33,37 26,41 26,41 C26,41 19,37 18,29 C17,18 26,10 26,10 Z" fill="#4DB33D" />
      </g>
      <g transform="translate(384, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p7" />
        <path d="M15,35 C14,26 19,17 28,15 C32,14 35,18 37,22 C33,21 30,22 29,25 C33,26 36,29 38,34 C34,33 31,31 28,31 C26,34 25,37 26,40 C22,38 18,36 15,35 Z" fill="none" stroke="#60baff" stroke-width="1.8" stroke-linejoin="round" />
      </g>
    </g>

    <!-- ROW 3: git, github, vscode, androidstudio -->
    <g transform="translate(4, 128)">
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="12" fill="#F05032" class="glow-box p1" />
        <path d="M26,11 L41,26 L26,41 L11,26 Z" fill="#ffffff" />
        <circle cx="26" cy="21" r="2.5" fill="#F05032" />
        <circle cx="26" cy="31" r="2.5" fill="#F05032" />
        <circle cx="31" cy="26" r="2.5" fill="#F05032" />
        <line x1="26" y1="21" x2="26" y2="31" stroke="#F05032" stroke-width="2" />
        <line x1="26" y1="22" x2="31" y2="26" stroke="#F05032" stroke-width="2" />
      </g>
      <g transform="translate(64, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p2" />
        <path d="M26,11 C17.7,11 11,17.7 11,26 C11,32.6 15.3,38.2 21.2,40.2 C22,40.3 22.3,39.9 22.3,39.5 L22.3,36.6 C18.1,37.5 17.3,34.6 17.3,34.6 C16.6,32.9 15.6,32.4 15.6,32.4 C14.3,31.5 15.7,31.5 15.7,31.5 C17.2,31.6 18,33 18,33 C19.3,35.3 21.5,34.6 22.3,34.2 C22.4,33.2 22.8,32.6 23.3,32.2 C19.9,31.8 16.5,30.5 16.5,24.8 C16.5,23.1 17.1,21.8 18,20.7 C17.9,20.3 17.3,18.8 18.2,16.8 C18.2,16.8 19.5,16.4 22.3,18.3 C23.5,18 24.7,17.8 26,17.8 C27.3,17.8 28.5,18 29.7,18.3 C32.5,16.4 33.8,16.8 33.8,16.8 C34.7,18.8 34.1,20.3 34,20.7 C34.9,21.8 35.5,23.1 35.5,24.8 C35.5,30.5 32,31.8 28.7,32.2 C29.3,32.7 29.8,33.6 29.8,35 L29.8,39.5 C29.8,39.9 30.1,40.4 30.9,40.2 C36.7,38.2 41,32.6 41,26 C41,17.7 34.3,11 26,11 Z" fill="#ffffff" />
      </g>
      <g transform="translate(128, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p3" />
        <polygon points="33,12 39,15 39,37 33,40 17,26" fill="#007ACC" />
        <polygon points="14,20 19,17 33,33 33,39" fill="#2E9EF7" />
        <polygon points="14,32 19,35 33,19 33,13" fill="#2E9EF7" />
      </g>
      <g transform="translate(192, 0)">
        <rect width="52" height="52" rx="12" fill="#161b22" class="glow-box p4" />
        <path d="M17,23 A9,9 0 0,1 35,23 Z" fill="#3DDC84" />
        <rect x="16" y="23" width="20" height="15" rx="3" fill="#4285F4" />
        <line x1="26" y1="21" x2="20" y2="41" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
        <line x1="26" y1="21" x2="32" y2="41" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>