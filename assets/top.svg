<svg width="800" height="200" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1830" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="waveBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153054" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2E9EF7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#153054" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="waveFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153054" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#60baff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#153054" stop-opacity="0.95" />
    </linearGradient>

    <!-- Robust GitHub-compatible reveal clip path -->
    <clipPath id="typeClip">
      <rect x="299" y="80" width="0" height="45">
        <animate attributeName="width" values="0;202" dur="1.2s" begin="0.3s" fill="freeze" />
      </rect>
    </clipPath>

    <style>
      .greeting {
        font-family: 'Courier New', Courier, monospace;
        font-size: 26px;
        fill: #2E9EF7;
      }
      /* Claude's signature editorial serif stack */
      .name {
        font-family: 'Copernicus', 'Tiempos Text', 'Iowan Old Style', 'Charter', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
        font-weight: 600;
        font-size: 42px;
        letter-spacing: -0.6px;
        fill: #f4f4f0;
        opacity: 0;
        animation: fadeName 1s ease-out 1.8s forwards;
      }
      .sub {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        fill: #9fd0ff;
        opacity: 0;
      }
      .sub1 { animation: cycle1 9s infinite 2.5s; }
      .sub2 { animation: cycle2 9s infinite 2.5s; }
      .sub3 { animation: cycle3 9s infinite 2.5s; }

      @keyframes fadeName {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycle1 {
        0%, 2% { opacity: 0; }
        6%, 30% { opacity: 1; }
        34%, 100% { opacity: 0; }
      }
      @keyframes cycle2 {
        0%, 33% { opacity: 0; }
        37%, 63% { opacity: 1; }
        67%, 100% { opacity: 0; }
      }
      @keyframes cycle3 {
        0%, 66% { opacity: 0; }
        70%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="10" fill="url(#bgGrad)" />

  <!-- Flow 1: Top Back Wave -->
  <path d="M0,0 L800,0 L800,55 C650,75 550,25 400,60 C250,95 150,35 0,65 Z" fill="url(#waveBack)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0,0 L800,0 L800,55 C650,75 550,25 400,60 C250,95 150,35 0,65 Z; M0,0 L800,0 L800,70 C650,30 550,80 400,45 C250,10 150,75 0,45 Z; M0,0 L800,0 L800,55 C650,75 550,25 400,60 C250,95 150,35 0,65 Z" />
  </path>

  <!-- Flow 2: Top Front Wave -->
  <path d="M0,0 L800,0 L800,45 C680,30 520,80 380,45 C220,10 120,65 0,40 Z" fill="url(#waveFront)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0,0 L800,0 L800,45 C680,30 520,80 380,45 C220,10 120,65 0,40 Z; M0,0 L800,0 L800,35 C680,70 520,20 380,55 C220,85 120,25 0,55 Z; M0,0 L800,0 L800,45 C680,30 520,80 380,45 C220,10 120,65 0,40 Z" />
  </path>

  <!-- Typewriter Greeting -->
  <g clip-path="url(#typeClip)">
    <text x="299" y="112" class="greeting">Hi there, I'm</text>
  </g>

  <!-- Moving Typewriter Cursor -->
  <rect y="91" width="2.5" height="25" fill="#2E9EF7">
    <animate attributeName="x" values="299;501" dur="1.2s" begin="0.3s" fill="freeze" />
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="1.5s" begin="0.3s" fill="freeze" />
  </rect>

  <!-- Name in Claude's Editorial Serif -->
  <text x="400" y="162" text-anchor="middle" class="name">Pasindu Saranga 👋</text>

  <!-- Cycling Subtitles (XML-Safe) -->
  <text x="400" y="202" text-anchor="middle" class="sub sub1">Software Engineering Undergraduate</text>
  <text x="400" y="202" text-anchor="middle" class="sub sub3">Building things, one commit at a time.</text>
</svg>
